project_id = "regrade"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = false
# Every dashboard visitor gets a silent anonymous session (see
# lib/supabase/ensure-user.ts) instead of a sign-in screen.
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = true
