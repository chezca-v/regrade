[platformio]
default_envs = esp32dev_all_sensors_test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    marcoschwartz/LiquidCrystal_I2C
    bogde/HX711
    pololu/VL53L0X
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit INA219
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo

[env:esp32dev_sensor_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<sensor_test.cpp>
lib_deps =
    bogde/HX711
    pololu/VL53L0X

